<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile | CustomCraft</title>
</head>

        {{ form.as_p }}

    </form>

    <p>
        <a href="{% url 'profile' %}">
            Back to Profile
        </a>
    </p>

</body>
</html>
